<svg xmlns="http://www.w3.org/2000/svg" width="480" height="104" viewBox="0 0 480 104" role="img" aria-label="Visit the Tiger Studio Manager site">
  <title>Visit the Tiger Studio Manager site</title>
  <defs>
    <linearGradient id="tsmFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#e6352b"/>
    </linearGradient>
    <linearGradient id="tsmGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="476" height="100" rx="50" fill="url(#tsmFill)"/>
  <rect x="2" y="2" width="476" height="50" rx="50" fill="url(#tsmGloss)"/>
  <rect x="2.5" y="2.5" width="475" height="99" rx="49.5" fill="none" stroke="#ffffff" stroke-opacity="0.30"/>

  <!-- A desktop screen with a download arrow: the app, for the computer. -->
  <g transform="translate(42 30)" fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.6" y="1.6" width="40.8" height="29" rx="5"/>
    <path d="M15 42.4h14M22 30.6v11.8"/>
    <path d="M22 8.5v13M16.5 16.5l5.5 5.5 5.5-5.5"/>
  </g>

  <text x="106" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Visit the Tiger Studio site</text>
  <text x="106" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="500" fill="#ffffff" fill-opacity="0.88">Download for Windows, macOS and Linux</text>

  <path d="M434 40 l12 12 l-12 12" fill="none" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
